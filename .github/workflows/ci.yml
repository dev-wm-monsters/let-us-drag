name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch ffmpeg (the same binary we ship)
        run: node scripts/fetch-ffmpeg.mjs
      - name: Point tests at the fetched ffmpeg
        shell: bash
        run: |
          exe=ffmpeg; [ "$RUNNER_OS" = "Windows" ] && exe=ffmpeg.exe
          plat=$(node -p process.platform); arch=$(node -p process.arch)
          echo "LUD_FFMPEG_PATH=$GITHUB_WORKSPACE/resources/bin/$plat-$arch/$exe" >> "$GITHUB_ENV"
      - name: Typecheck
        shell: bash
        run: mkdir -p ci-logs && set -o pipefail && npm run typecheck 2>&1 | tee ci-logs/typecheck.log
      - name: Lint
        shell: bash
        run: set -o pipefail && npm run lint 2>&1 | tee ci-logs/lint.log
      - name: Build
        shell: bash
        run: set -o pipefail && npm run build 2>&1 | tee ci-logs/build.log
      - name: Compile check macOS modifier helper (lud-modifiers; shipped by package.yml)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        run: |
          set -o pipefail
          swiftc -O -target "$(uname -m)-apple-macos12" native/mac-modifiers/main.swift -o /tmp/lud-modifiers 2>&1 | tee ci-logs/modifier-helper.log
          # stdin closed at once: the helper must exit 0 quickly (it dies with its parent)
          /tmp/lud-modifiers </dev/null >/tmp/lud-modifiers.out & pid=$!
          for _ in $(seq 50); do kill -0 "$pid" 2>/dev/null || break; sleep 0.1; done
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "lud-modifiers did not exit after stdin closed" | tee -a ci-logs/modifier-helper.log; exit 1; fi
          wait "$pid"
          if grep -qvE '^shift=[01] ctrl=[01] alt=[01] meta=[01]$' /tmp/lud-modifiers.out; then echo "unexpected output" | tee -a ci-logs/modifier-helper.log; exit 1; fi
          echo "lud-modifiers compiled and exited 0 on stdin EOF" | tee -a ci-logs/modifier-helper.log
      - name: Cache Remove-BG model (Linux only, used by the real-model test)
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/lud-models
          key: isnet-general-use-60920e99
      - name: Fetch Remove-BG model (Linux only; SHA-256 verified)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          m=node_modules/.cache/lud-models/isnet-general-use.onnx
          if [ -f "$m" ]; then echo "model restored from cache: $(sha256sum "$m")" | tee ci-logs/model.log; else node scripts/fetch-model.mjs 2>&1 | tee ci-logs/model.log; fi
          echo "LUD_MODEL_PATH=$GITHUB_WORKSPACE/node_modules/.cache/lud-models/isnet-general-use.onnx" >> "$GITHUB_ENV"
      - name: Unit + engine tests
        shell: bash
        run: set -o pipefail && npm test 2>&1 | tee ci-logs/test.log
      - name: E2E (Linux, Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: set -o pipefail && xvfb-run -a npm run test:e2e 2>&1 | tee ci-logs/e2e.log
      - name: Report results as annotations
        if: always()
        shell: bash
        run: |
          for f in ci-logs/*.log; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .log)
            if grep -qiE "(error|failed|✗|×)" "$f"; then lvl=warning; else lvl=notice; fi
            node scripts/ci-report.mjs "$lvl" "${{ matrix.os }} $name" "$f" 60
          done
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-artifacts-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
