name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch ffmpeg (the same binary we ship)
        run: node scripts/fetch-ffmpeg.mjs
      - name: Point tests at the fetched ffmpeg
        shell: bash
        run: |
          exe=ffmpeg; [ "$RUNNER_OS" = "Windows" ] && exe=ffmpeg.exe
          plat=$(node -p process.platform); arch=$(node -p process.arch)
          echo "LUD_FFMPEG_PATH=$GITHUB_WORKSPACE/resources/bin/$plat-$arch/$exe" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: E2E (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
