name: FFmpeg probe (macOS)

# One-off investigation job: resolve candidate GPL static ffmpeg builds for macOS, verify licence
# flags and encoders, and report URL + SHA-256 as annotations (so the TPM can pin them).
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: ['.github/workflows/ffmpeg-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Probe Martin Riedl release build
        shell: bash {0}
        run: |
          mkdir -p probe ci-logs && cd probe
          log=../ci-logs/probe.log
          curl -sSL -A "Mozilla/5.0 let-us-drag-ci" -o index.html -w "homepage http=%{http_code} bytes=%{size_download}\n" https://ffmpeg.martin-riedl.de/ | tee -a $log
          echo "--- all hrefs mentioning macos (first 40):" | tee -a $log
          grep -oiE 'href="[^"]*macos[^"]*"' index.html | sort -u | head -40 | tee -a $log
          grep -oE '/download/macos/${{ matrix.arch }}/[^"]*ffmpeg[^"]*\.zip' index.html | sort -u > links.txt
          echo "--- zip links:" | tee -a $log; cat links.txt | tee -a $log
          path=$(grep -E "_[0-9]+\.[0-9]+(\.[0-9]+)?/" links.txt | sort -r | head -1)
          [ -n "$path" ] || path=$(head -1 links.txt)
          if [ -z "$path" ] && [ "${{ matrix.arch }}" = "amd64" ]; then path=/download/macos/amd64/1789931006_9.0.2/ffmpeg.zip; echo "using known pinned amd64 path" | tee -a $log; fi
          if [ -z "$path" ] && [ "${{ matrix.arch }}" = "arm64" ]; then path=/download/macos/arm64/1789931890_9.0.2/ffmpeg.zip; echo "using known pinned arm64 path" | tee -a $log; fi
          [ -n "$path" ] || { echo "no download link found" | tee -a $log; exit 0; }
          url="https://ffmpeg.martin-riedl.de$path"
          curl -sSL -A "Mozilla/5.0 let-us-drag-ci" -o ffmpeg.zip -w "zip http=%{http_code} bytes=%{size_download}\n" "$url" | tee -a $log
          { echo "chosen url: $url"; echo "sha256(zip): $(shasum -a 256 ffmpeg.zip | cut -d' ' -f1)"; } | tee -a $log
          unzip -o -q ffmpeg.zip 2>&1 | tee -a $log; ls -la | tee -a $log
          [ -f ffmpeg ] || { echo "no ffmpeg in zip" | tee -a $log; exit 0; }
          chmod +x ffmpeg
          { echo "sha256(binary): $(shasum -a 256 ffmpeg | cut -d' ' -f1)"; file ffmpeg; ./ffmpeg -hide_banner -version | head -3;
            echo "--- -L (first 5 lines)"; ./ffmpeg -hide_banner -L | head -5;
            echo "--- buildconf nonfree/gpl:"; ./ffmpeg -hide_banner -buildconf | grep -iE "nonfree|enable-gpl|version3";
            echo "--- minimum macOS (LC_BUILD_VERSION / LC_VERSION_MIN_MACOSX)"; otool -l ffmpeg | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos|version" | head -4;
            echo "--- non-system dynamic deps"; otool -L ffmpeg | tail -n +2 | grep -vE "/System/Library/|/usr/lib/" || echo "(none)";
            echo "--- encoders"; ./ffmpeg -hide_banner -encoders > enc.txt;
            for e in libx264 libvpx-vp9 libopus libmp3lame libvorbis aac flac pcm_s16le gif png mjpeg bmp; do grep -q " $e " enc.txt && echo "ok $e" || echo "MISSING $e"; done;
            echo "--- codesign"; codesign -dv ffmpeg 2>&1 | head -5; } 2>&1 | tee -a $log
          exit 0
      - name: Report
        if: always()
        run: node scripts/ci-report.mjs notice "ffmpeg probe ${{ matrix.arch }}" ci-logs/probe.log 200
