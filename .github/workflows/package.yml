name: Package

on:
  # Packaging uses 4 runners (2 of them macOS); run it on main, on release tags, or on demand.
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a DRAFT release with this tag (e.g. v0.1.0-beta.1) on the dispatched commit; empty = artifacts only'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-15, builder: --mac --arm64, plat: darwin, arch: arm64 }
          - { name: mac-x64, os: macos-15-intel, builder: --mac --x64, plat: darwin, arch: x64 }
          - { name: win-x64, os: windows-latest, builder: --win --x64, plat: win32, arch: x64 }
          - { name: linux-x64, os: ubuntu-latest, builder: --linux --x64, plat: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch ffmpeg
        shell: bash
        run: mkdir -p ci-logs && set -o pipefail && node scripts/fetch-ffmpeg.mjs ${{ matrix.plat }} ${{ matrix.arch }} 2>&1 | tee ci-logs/ffmpeg.log
      - name: Verify ffmpeg encoders we rely on
        shell: bash
        run: |
          exe=resources/bin/${{ matrix.plat }}-${{ matrix.arch }}/ffmpeg
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          "$exe" -hide_banner -encoders > encoders.txt
          "$exe" -hide_banner -version | head -1 | tee -a ci-logs/ffmpeg.log
          for e in libx264 libvpx-vp9 libopus libmp3lame libvorbis aac flac pcm_s16le gif png mjpeg bmp; do
            grep -q " $e " encoders.txt || { echo "missing encoder: $e" | tee -a ci-logs/ffmpeg.log; exit 1; }
          done
          echo "all required encoders present" | tee -a ci-logs/ffmpeg.log
      - name: Build
        shell: bash
        run: set -o pipefail && npm run build 2>&1 | tee ci-logs/build.log
      - name: Package
        shell: bash
        run: set -o pipefail && npx electron-builder ${{ matrix.builder }} --publish never 2>&1 | tee ci-logs/package.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Inspect macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find release -maxdepth 3 -name "*.app" | head -1)
          { echo "app: $app"; codesign -dv --verbose=2 "$app" 2>&1 | head -20; codesign --verify --deep --strict "$app" && echo "codesign verify: OK";
            lipo -archs "$app/Contents/MacOS/"* 2>&1; } | tee ci-logs/signature.log
      - name: Smoke-start the packaged app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y -qq xvfb >/dev/null; pre="xvfb-run -a"; else pre=""; fi
          set -o pipefail && $pre node scripts/ci-smoke-packaged.mjs 2>&1 | tee ci-logs/smoke.log
      - name: Read fuses
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) app=$(find release -maxdepth 2 -name "*.app" | head -1) ;;
            Windows) app="release/win-unpacked/Let us drag!.exe" ;;
            *) app=release/linux-unpacked/let-us-drag ;;
          esac
          npx --yes @electron/fuses@1.8.0 read --app "$app" 2>&1 | tee ci-logs/fuses.log
      - name: QA packaging checks
        shell: bash
        run: set -o pipefail && node tests/qa/check-artifacts.mjs --platform ${{ matrix.plat }} --arch ${{ matrix.arch }} 2>&1 | tee ci-logs/qa-artifacts.log
      - name: Artifact sizes
        shell: bash
        run: ls -la release/ | grep -E "\.(dmg|exe|AppImage|deb)$" | tee ci-logs/sizes.log
      - name: Report results as annotations
        if: always()
        shell: bash
        run: |
          for f in ci-logs/*.log; do
            [ -f "$f" ] || continue
            node scripts/ci-report.mjs notice "${{ matrix.name }} $(basename "$f" .log)" "$f" 60
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LetUsDrag-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  draft-release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --prerelease --title "Let us drag! $TAG" \
            --notes "Private test build. Install notes and the manual test checklist: docs/qa/MANUAL_CHECKLIST.md. Project report: docs/REPORT.md."
