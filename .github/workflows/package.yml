name: Package

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-15, builder: --mac --arm64, plat: darwin, arch: arm64 }
          - { name: mac-x64, os: macos-15-intel, builder: --mac --x64, plat: darwin, arch: x64 }
          - { name: win-x64, os: windows-latest, builder: --win --x64, plat: win32, arch: x64 }
          - { name: linux-x64, os: ubuntu-latest, builder: --linux --x64, plat: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-ffmpeg.mjs ${{ matrix.plat }} ${{ matrix.arch }}
      - name: Verify ffmpeg encoders we rely on
        shell: bash
        run: |
          exe=resources/bin/${{ matrix.plat }}-${{ matrix.arch }}/ffmpeg
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          "$exe" -hide_banner -encoders > encoders.txt
          for e in libx264 libvpx-vp9 libopus libmp3lame libvorbis aac flac pcm_s16le gif png mjpeg bmp; do
            grep -q " $e " encoders.txt || { echo "missing encoder: $e"; exit 1; }
          done
          echo "all required encoders present"
      - run: npm run build
      - run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Inspect macOS signature
        if: runner.os == 'macOS'
        run: |
          app=$(find release -maxdepth 3 -name "*.app" | head -1)
          codesign -dv --verbose=2 "$app" 2>&1 | head -20
          lipo -archs "$app/Contents/MacOS/"* || true
      - uses: actions/upload-artifact@v4
        with:
          name: LetUsDrag-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  draft-release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease --title "Let us drag! ${GITHUB_REF_NAME}" \
            --notes "Pre-release test build. See docs/REPORT.md for the manual test checklist."
